name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # ручной запуск из вкладки Actions
  schedule:
    - cron: '17 3 * * *' # раз в сутки — обновить версии и счётчики скачиваний из GitHub Releases

permissions:
  contents: read
  discussions: read # чтобы показывать число реакций и комментариев на карточках
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
          # Для репозитория <ник>.github.io сайт живёт в корне, иначе — в /<имя-репозитория>
          BASE_PATH: ${{ endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}', github.event.repository.name) }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
